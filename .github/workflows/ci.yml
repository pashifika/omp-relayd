name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# One in-flight run per pull request, or per ref outside one. A newer push
# supersedes and cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runtime job. Language-specific jobs are added by the changes that introduce
  # those toolchains, and each extends the `ci` gate's `needs`.
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the workflow tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Verify every action reference is SHA-pinned with a version comment
        timeout-minutes: 5
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "hygiene: no workflow files under .github/workflows; this check would verify nothing"
            exit 1
          fi

          echo "hygiene: scanning ${#files[@]} workflow file(s)"
          printf '  %s\n' "${files[@]}"

          awk '
          BEGIN {
            checked = 0
            violations = 0
            sq = sprintf("%c", 39)
          }
          {
            line = $0
            sub(/^[[:space:]]+/, "", line)

            # A commented-out example is documentation, not a live reference.
            if (line ~ /^#/) next

            sub(/^-[[:space:]]+/, "", line)
            if (line !~ /^uses:[[:space:]]*/) next
            sub(/^uses:[[:space:]]*/, "", line)

            # Separate the trailing version comment from the reference itself.
            comment = ""
            hash = index(line, "#")
            if (hash > 0) {
              comment = substr(line, hash + 1)
              line = substr(line, 1, hash - 1)
            }
            sub(/[[:space:]]+$/, "", line)
            sub(/^[[:space:]]+/, "", comment)
            sub(/[[:space:]]+$/, "", comment)

            ref = line
            if (length(ref) > 1) {
              first = substr(ref, 1, 1)
              last = substr(ref, length(ref), 1)
              if ((first == "\"" && last == "\"") || (first == sq && last == sq))
                ref = substr(ref, 2, length(ref) - 2)
            }
            if (ref == "") next

            checked++

            # Action references carry exactly one "@"; scan from the right so a
            # reusable-workflow path never confuses the split.
            at = 0
            for (i = length(ref); i > 0; i--)
              if (substr(ref, i, 1) == "@") { at = i; break }

            if (at == 0) {
              printf "  FAIL %s:%d %s -- not pinned to a commit SHA\n", FILENAME, FNR, ref
              violations++
              next
            }

            sha = substr(ref, at + 1)
            if (sha !~ /^[0-9a-f]{40}$/) {
              printf "  FAIL %s:%d %s -- not pinned to a full 40-character commit SHA\n", FILENAME, FNR, ref
              violations++
              next
            }

            if (comment == "") {
              printf "  FAIL %s:%d %s -- SHA pin carries no trailing version comment\n", FILENAME, FNR, ref
              violations++
              next
            }

            printf "  ok   %s:%d %s (%s)\n", FILENAME, FNR, ref, comment
          }
          END {
            if (checked == 0) {
              print "hygiene: no uses: references found; this check would verify nothing"
              exit 1
            }
            if (violations > 0) {
              printf "hygiene: %d of %d reference(s) rejected; every uses: must read owner/repo@<40-hex-sha> # <version>\n", violations, checked
              exit 1
            }
            printf "hygiene: %d reference(s) checked, all SHA-pinned with a version comment\n", checked
          }
          ' "${files[@]}"

  # Runtime job. Owns the Rust crate under `server/`, whose toolchain this
  # change introduces.
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      # Pinned, not a floating channel: a toolchain that changes underneath a
      # previously green build makes a red one unexplainable. Bump deliberately.
      RUST_VERSION: 1.97.1
      # The oldest toolchain `server/Cargo.toml` claims to support. Checked
      # below so the claim cannot rot into a comment nobody verifies.
      RUST_MSRV: 1.85.0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail

          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component clippy,rustfmt \
            --no-self-update
          rustup default "$RUST_VERSION"

          # Printed, not assumed: every result below belongs to these versions.
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      # `--all-targets` builds the tests too, and their dev-dependency features
      # unify into the library's. So a feature the library genuinely needs can be
      # declared only under `[dev-dependencies]` and every other check here will
      # still pass, while a consumer building just the library fails. That is not
      # hypothetical: `tokio`'s `io-util` was declared that way and the library
      # did not build standalone.
      - name: Check the library on its own features
        timeout-minutes: 5
        run: cargo check --locked --lib

      - name: Lint
        timeout-minutes: 10
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        timeout-minutes: 10
        run: cargo test --locked --all-features

      - name: Build documentation
        timeout-minutes: 10
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Check the declared minimum supported Rust version
        timeout-minutes: 10
        run: |
          set -euo pipefail

          rustup toolchain install "$RUST_MSRV" --profile minimal --no-self-update
          cargo "+$RUST_MSRV" --version
          cargo "+$RUST_MSRV" check --locked --all-targets --all-features

  # Runtime job. Owns the TypeScript client library under `extension/`, whose
  # toolchain this change introduces.
  #
  # Deliberately Bun-only. The relay-dependent tests live in `interop` below so
  # that a type error or a broken accumulator is reported without first paying
  # for a Rust toolchain and a release build, and so a red job names which layer
  # broke. The two run in parallel, so the split costs no wall time.
  bun:
    name: bun
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Install the pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          # Pinned, not `latest`: a runtime that changes underneath a previously
          # green build makes a red one unexplainable. Bump deliberately, in
          # step with `@types/bun` in `extension/package.json`.
          bun-version: 1.3.14

      - name: Install dependencies
        timeout-minutes: 5
        # `--frozen-lockfile` is the point of committing `bun.lock`: a
        # dependency resolving differently in CI than locally is a failure, not
        # an update to perform silently.
        run: bun install --frozen-lockfile

      - name: Report the toolchain versions
        timeout-minutes: 5
        # Printed, not assumed: every result below belongs to these versions.
        run: |
          bun --version
          bunx tsc --version

      - name: Type-check
        timeout-minutes: 5
        # Through the package scripts, not the underlying commands: a flag that
        # lives in only one of the two places is a difference between what a
        # contributor runs and what the gate runs.
        run: bun run typecheck

      - name: Unit and fixture tests
        timeout-minutes: 5
        run: bun run test:unit

      - name: Build and smoke-test the standalone extension bundle
        timeout-minutes: 5
        run: bun run test:packaging

      # `test:packaging` rebuilds `dist/index.js` before loading it, so a green
      # packaging step proves that a fresh bundle builds and loads -- never that
      # the committed one matches the source beside it. The README tells an
      # operator to load the committed file directly after `git clone`, with no
      # build step, so without this a pull request carrying an innocuous source
      # diff and a substituted bundle would merge green.
      - name: Verify the committed bundle matches the one built from source
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # A pathspec matching nothing makes `git diff` exit 0, so the path is
          # confirmed tracked before its diff is trusted. Paths are relative to
          # this job's `extension` working directory.
          git ls-files --error-unmatch dist/index.js
          git diff --exit-code -- dist/index.js

  # Runtime job. Proves the two implementations actually agree, by running the
  # TypeScript client against the real relay binary rather than against a mock.
  #
  # Needs both toolchains, which is why it is its own job: a mock would agree
  # with whatever the TypeScript side believes, and that agreement is precisely
  # the thing under test.
  interop:
    name: interop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Kept in step with the `rust` job above; both build the same crate.
      RUST_VERSION: 1.97.1
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail

          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Install the pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        timeout-minutes: 5
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Build the relay the integration tests spawn
        timeout-minutes: 15
        working-directory: server
        # Built here rather than left to the test helper so that a compilation
        # failure is reported as a build failure, not as a test timing out while
        # waiting for a binary that was never going to appear.
        run: cargo build --locked --release --bin omp-relayd

      - name: Integration tests against the relay binary
        timeout-minutes: 10
        working-directory: extension
        run: bun run test:integration

  # The single status check branch protection requires. `.github/rulesets/main.json`
  # names the literal string `ci`; nothing mechanically verifies the two agree, so
  # renaming this job silently blocks every merge with no failing job to point at.
  ci:
    name: ci
    needs: [hygiene, rust, bun, interop]
    # `always()` is load-bearing. Without it this job is skipped when a dependency
    # fails, and a skipped required check blocks a pull request rather than failing
    # it -- a stuck merge button instead of a red one.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate runtime job results
        timeout-minutes: 5
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          count=$(jq 'length' <<< "$RESULTS")

          if [ "$count" -eq 0 ]; then
            echo "ci: no aggregated jobs; the gate would report success while verifying nothing"
            exit 1
          fi

          echo "ci: aggregating $count job result(s)"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$RESULTS"

          # Anything other than success -- failure, cancellation, or a skip -- is a
          # failure of the gate. A skipped dependency must not pass as verified.
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$RESULTS")

          if [ -n "$failed" ]; then
            echo "ci: gate failed; these jobs did not succeed:"
            printf '  %s\n' $failed
            exit 1
          fi

          echo "ci: all $count job(s) succeeded"
