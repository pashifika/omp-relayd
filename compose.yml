services:
  relay:
    # With both `build` and `image` present and no `pull_policy`, Compose pulls
    # the named image and builds from source only when it cannot be obtained. So
    # `docker compose up -d` deploys the published image, `--build` forces the
    # working tree, and a clone still starts before a version has been published.
    build:
      context: .
    image: pashifika/omp-relayd:0.2.0
    restart: unless-stopped

    # The relay has no authentication and no encryption, so the default binding
    # is loopback: reaching it requires being on this host. Exposing it to a
    # trusted private LAN is one explicit override and nothing else:
    #
    #   OMP_RELAY_BIND=192.168.1.10 docker compose up -d
    #
    # There is no public mode. `OMP_RELAY_BIND=0.0.0.0` would publish the port
    # on every interface, which this deployment does not support.
    ports:
      - "${OMP_RELAY_BIND:-127.0.0.1}:7788:7788"

    environment:
      RUST_LOG: ${RUST_LOG:-info}

    # The relay reads no configuration file and persists nothing, so its root
    # filesystem is read-only: a writable filesystem or any retained capability
    # would only be available to an attacker who reached the unauthenticated
    # port.
    #
    # The payload store is the one thing that writes, and this tmpfs is what it
    # writes to. Three properties, none incidental:
    #
    #   * `read_only: true` survives. Without this mount the relay exits at
    #     startup with "could not open the payload store ... Read-only file
    #     system", because there is nowhere under `/tmp` to create it.
    #   * The size bounds the store at the layer that can actually enforce it.
    #     The relay's own ceiling is 256 MiB, so 320m leaves the relay's clean
    #     `store_full` refusal as the bound a sender reaches, rather than an I/O
    #     error from a full filesystem.
    #   * Nothing survives the container, which is what the store's contract
    #     already promises. A named volume would be a persistence-shaped thing
    #     holding data that must not persist.
    #
    # tmpfs is RAM-backed, so this is a ceiling on memory as well as on bytes
    # held. An operator who would rather spend disk than RAM can mount a sized
    # filesystem at `/tmp` instead; the relay reads `TMPDIR` and needs nothing
    # else. See `rasen/docs/omp-relay-messagepack-protocol-design.md` §13.1.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=320m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
