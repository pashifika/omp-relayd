[package]
name = "omp-relayd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-memory TCP relay routing MessagePack frames between named OMP peers"
license = "MIT"
publish = false

[lib]
name = "omp_relayd"
path = "src/lib.rs"

[[bin]]
name = "omp-relayd"
path = "src/main.rs"

[dependencies]
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
# Payload transfer speaks HTTP, and the choice is about the *client* side rather
# than this one: Bun's `fetch` is built in, `curl` works for diagnosis, a browser
# can confirm a payload by hand, and `Content-Length` gives a ceiling check
# before a byte of body is read. A custom framed protocol would need an
# implementation in both languages and buy none of that.
#
# `hyper` with a function service, three routes and one method each. Rejected --
# `axum`, whose router and tower middleware stack are the parts that would go
# unused. Rejected -- a hand-written HTTP/1.1 parser, defensible for exactly one
# route and not for the moment `HEAD` or a future `Range` needs correct header
# handling; request smuggling and header edge cases are a bad place to economize
# on a dependency.
#
# `hyper-util` is not a fourth choice. `hyper` 1.x deliberately dropped its
# `tokio` dependency and moved the adapter here, so "hyper 1.x on tokio" is these
# two crates. Writing the adapter by hand means reimplementing `hyper::rt::Read`
# over `ReadBufCursor`, which without `unsafe` -- forbidden in this crate -- costs
# a copy per read and forty lines of pin projection to maintain.
#
# All of them are pure Rust with no C build step, which is the cost that ruled
# out SQLite for a container built natively on two architectures.
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
# Pure Rust with no C build step, which is the specific cost that ruled out
# SQLite for a container built natively on two architectures. Chosen over
# BLAKE3, which is faster but would need a wasm or JavaScript implementation as
# a new extension dependency for a hash that is never the bottleneck beside a
# network transfer -- the TypeScript side gets SHA-256 from Web Crypto for free.
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = [
    # `fs` is a runtime need: the payload store streams a payload to a temporary
    # file and renames it, and doing that with `std::fs` would block a runtime
    # worker for the length of a transfer.
    "fs",
    # `io-util` is a runtime need, not a test one: `tokio::io::split` and its
    # `ReadHalf`/`WriteHalf` are how the connection reads and writes
    # independently. It reached the library through dev-dependency feature
    # unification at first, which builds tests and `--all-targets` but leaves
    # `cargo build -p omp-relayd --lib` and `cargo doc` failing.
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# `io` bridges a payload file to a response body without buffering it, so a
# `GET` streams from the filesystem rather than reading a whole payload into
# memory first.
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `test-util` gives tests a paused clock. `io-util`'s in-memory duplex streams
# exercise the generic transport seam without a socket, and it is declared
# above because the library itself needs it.
tokio = { version = "1.44", features = ["test-util"] }

[lints.rust]
# The relay parses untrusted input from the network. Nothing here needs `unsafe`,
# so the lint is `forbid`: a future `#[allow]` cannot silently re-enable it.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Groups sit below individual lints so a specific `allow` below is not a
# same-priority conflict with the group that enables it.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Every public item is a relay internal reached only by this crate's own binary
# and tests, so an unused return value is never a caller-visible bug.
must_use_candidate = "allow"
