[package]
name = "omp-relayd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-memory TCP relay routing MessagePack frames between named OMP peers"
license = "MPL-2.0"
publish = false

[lib]
name = "omp_relayd"
path = "src/lib.rs"

[[bin]]
name = "omp-relayd"
path = "src/main.rs"

[dependencies]
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.44", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `test-util` gives tests a paused clock; `io-util` gives them in-memory duplex
# streams, which exercise the generic transport seam without a socket.
tokio = { version = "1.44", features = ["io-util", "test-util"] }

[lints.rust]
# The relay parses untrusted input from the network. Nothing here needs `unsafe`,
# so the lint is `forbid`: a future `#[allow]` cannot silently re-enable it.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Groups sit below individual lints so a specific `allow` below is not a
# same-priority conflict with the group that enables it.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Every public item is a relay internal reached only by this crate's own binary
# and tests, so an unused return value is never a caller-visible bug.
must_use_candidate = "allow"
